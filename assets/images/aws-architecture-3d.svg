<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e2238" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b4e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#170d2b" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="tier4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16382c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b2119" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FFB84D"/>
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c471ed"/>
      <stop offset="100%" stop-color="#f64f59"/>
    </linearGradient>

    <linearGradient id="greenNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ba360"/>
      <stop offset="100%" stop-color="#3cba92"/>
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .pulse-line {
      stroke-dasharray: 8, 12;
      animation: dashMove 1.5s linear infinite;
    }
    .pulse-line-rev {
      stroke-dasharray: 8, 12;
      animation: dashMoveRev 1.5s linear infinite;
    }
    .pulse-glow {
      animation: pulseGlow 2.5s ease-in-out infinite alternate;
    }
    .hover-lift {
      transition: transform 0.3s ease;
    }
    .hover-lift:hover {
      transform: translateY(-4px);
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes dashMoveRev {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 40; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.5; filter: drop-shadow(0 0 2px #00f2fe); }
      100% { opacity: 1; filter: drop-shadow(0 0 10px #00f2fe); }
    }
    @keyframes orbitPulse {
      0% { r: 4; opacity: 0.8; }
      50% { r: 7; opacity: 1; }
      100% { r: 4; opacity: 0.8; }
    }
    .orbit-dot {
      animation: orbitPulse 2s ease-in-out infinite;
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="680" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Tech Grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 100 L 1000 100 M 0 200 L 1000 200 M 0 300 L 1000 300 M 0 400 L 1000 400 M 0 500 L 1000 500 M 0 600 L 1000 600" />
    <path d="M 150 0 L 150 680 M 300 0 L 300 680 M 450 0 L 450 680 M 600 0 L 600 680 M 750 0 L 750 680 M 900 0 L 900 680" />
  </g>

  <!-- Title Badge Top Header -->
  <g transform="translate(40, 30)">
    <rect width="360" height="42" rx="21" fill="#0f172a" stroke="#FF9900" stroke-width="1.5" filter="url(#glowOrange)"/>
    <circle cx="24" cy="21" r="10" fill="#FF9900"/>
    <text x="24" y="25" text-anchor="middle" font-size="12" font-weight="900" fill="#000">AWS</text>
    <text x="46" y="26" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="0.5">VoteSecure — 3D Architecture</text>
    
    <rect x="380" y="8" width="180" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="396" cy="21" r="5" fill="#38bdf8" class="orbit-dot"/>
    <text x="410" y="26" fill="#bae6fd" font-size="11" font-weight="600">Enterprise High-Availability</text>
    
    <rect x="580" y="8" width="160" height="26" rx="13" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <circle cx="596" cy="21" r="5" fill="#10b981"/>
    <text x="610" y="26" fill="#a7f3d0" font-size="11" font-weight="600">VPC CIDR: 10.0.0.0/16</text>
  </g>

  <!-- ===================================================================== -->
  <!-- STEP 1 (TOP TIER): EDGE & INGRESS (DNS & SECURITY)                    -->
  <!-- ===================================================================== -->
  <g transform="translate(50, 95)">
    <rect width="900" height="95" rx="14" fill="url(#tier1Grad)" stroke="#475569" stroke-width="1.5" filter="url(#boxShadow)"/>
    <!-- Stepped 3D Edge Accent -->
    <path d="M 0 14 L 14 0 L 900 0 L 886 14 Z" fill="#334155" opacity="0.5"/>
    <text x="24" y="26" fill="#94a3b8" font-size="11" font-weight="800" letter-spacing="1">STEP 1: EDGE TRAFFIC, DNS &amp; INGRESS LAYER</text>

    <!-- User Clients -->
    <g transform="translate(30, 36)" class="hover-lift">
      <rect width="120" height="46" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="60" y="24" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">👥 Voters &amp; Admins</text>
      <text x="60" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">Public HTTPS (443)</text>
    </g>

    <!-- Route 53 -->
    <g transform="translate(220, 36)" class="hover-lift">
      <rect width="140" height="46" rx="8" fill="#0f172a" stroke="#FF9900" stroke-width="1.5" filter="url(#glowOrange)"/>
      <text x="70" y="22" fill="#FFB84D" font-size="12" font-weight="700" text-anchor="middle">🌐 AWS Route 53</text>
      <text x="70" y="37" fill="#cbd5e1" font-size="9" text-anchor="middle">Global DNS &amp; Failover</text>
    </g>

    <!-- AWS WAF & Shield -->
    <g transform="translate(430, 36)" class="hover-lift">
      <rect width="140" height="46" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.2"/>
      <text x="70" y="22" fill="#f472b6" font-size="12" font-weight="700" text-anchor="middle">🛡️ AWS WAF</text>
      <text x="70" y="37" fill="#cbd5e1" font-size="9" text-anchor="middle">DDoS &amp; Bot Protection</text>
    </g>

    <!-- Internet Gateway -->
    <g transform="translate(640, 36)" class="hover-lift">
      <rect width="150" height="46" rx="8" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5" filter="url(#glowCyan)"/>
      <text x="75" y="22" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">🚪 Internet Gateway</text>
      <text x="75" y="37" fill="#cbd5e1" font-size="9" text-anchor="middle">VPC IGW (0.0.0.0/0)</text>
    </g>

    <!-- Edge Data Flow Connectors -->
    <line x1="150" y1="59" x2="220" y2="59" stroke="#38bdf8" stroke-width="2" class="pulse-line"/>
    <line x1="360" y1="59" x2="430" y2="59" stroke="#FF9900" stroke-width="2" class="pulse-line"/>
    <line x1="570" y1="59" x2="640" y2="59" stroke="#00f2fe" stroke-width="2" class="pulse-line"/>
  </g>

  <!-- Animated Stepped Pipe between Tier 1 and Tier 2 -->
  <path d="M 715 190 L 715 225 L 350 225 L 350 240" fill="none" stroke="#00f2fe" stroke-width="2.5" class="pulse-line"/>

  <!-- ===================================================================== -->
  <!-- STEP 2: PUBLIC SUBNET & DMZ (LOAD BALANCING & BASTION)               -->
  <!-- ===================================================================== -->
  <g transform="translate(50, 235)">
    <rect width="900" height="110" rx="14" fill="url(#tier2Grad)" stroke="#0284c7" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="24" y="26" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="1">STEP 2: PUBLIC DMZ SUBNET (10.0.1.0/24) — INGRESS &amp; SECURITY</text>

    <!-- Application Load Balancer -->
    <g transform="translate(180, 42)" class="hover-lift">
      <rect width="240" height="52" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#glowCyan)"/>
      <text x="120" y="24" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">⚖️ Application Load Balancer (ALB)</text>
      <text x="120" y="41" fill="#94a3b8" font-size="10" text-anchor="middle">Port 80/443 SSL Termination &amp; Health Probe</text>
    </g>

    <!-- Bastion Jump Host -->
    <g transform="translate(470, 42)" class="hover-lift">
      <rect width="200" height="52" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="24" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">🏰 Bastion Jump Host</text>
      <text x="100" y="41" fill="#cbd5e1" font-size="10" text-anchor="middle">EC2 t3.micro | SSH Port 22</text>
    </g>

    <!-- NAT Gateway -->
    <g transform="translate(710, 42)" class="hover-lift">
      <rect width="160" height="52" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="80" y="24" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">🔄 NAT Gateway</text>
      <text x="80" y="41" fill="#cbd5e1" font-size="10" text-anchor="middle">Outbound Egress Only</text>
    </g>

    <!-- Connections within Tier 2 -->
    <line x1="420" y1="68" x2="470" y2="68" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Animated Stepped Pipes between Tier 2 and Tier 3 -->
  <!-- ALB Traffic to App Subnet -->
  <path d="M 300 345 L 300 380" fill="none" stroke="#38bdf8" stroke-width="2.5" class="pulse-line"/>
  <!-- Bastion SSH to App Instance -->
  <path d="M 570 345 L 570 380" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,6"/>
  <!-- NAT Gateway to Containers -->
  <path d="M 790 345 L 790 380" fill="none" stroke="#34d399" stroke-width="2" class="pulse-line-rev"/>

  <!-- ===================================================================== -->
  <!-- STEP 3: PRIVATE APP SUBNET (CONTAINERS & COMPUTE)                    -->
  <!-- ===================================================================== -->
  <g transform="translate(50, 380)">
    <rect width="900" height="125" rx="14" fill="url(#tier3Grad)" stroke="#a855f7" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="24" y="26" fill="#c084fc" font-size="11" font-weight="800" letter-spacing="1">STEP 3: PRIVATE APPLICATION SUBNET (10.0.2.0/24) — DOCKER &amp; K8S</text>

    <!-- VoteSecure Pod 1 (AZ-1) -->
    <g transform="translate(30, 42)" class="hover-lift">
      <rect width="250" height="66" rx="10" fill="#0f172a" stroke="#2496ed" stroke-width="1.8"/>
      <circle cx="24" cy="33" r="14" fill="#2496ed" opacity="0.2"/>
      <text x="24" y="37" font-size="14" text-anchor="middle">🐳</text>
      <text x="48" y="28" fill="#ffffff" font-size="12" font-weight="700">VoteSecure Pod 1 (Primary)</text>
      <text x="48" y="44" fill="#38bdf8" font-size="10">PHP 8.2-Apache | Port 80</text>
      <text x="48" y="58" fill="#94a3b8" font-size="9">Liveness Probe: /health.php</text>
    </g>

    <!-- VoteSecure Pod 2 (AZ-2 Rolling Replica) -->
    <g transform="translate(310, 42)" class="hover-lift">
      <rect width="250" height="66" rx="10" fill="#0f172a" stroke="#326ce5" stroke-width="1.8"/>
      <circle cx="24" cy="33" r="14" fill="#326ce5" opacity="0.2"/>
      <text x="24" y="37" font-size="14" text-anchor="middle">☸️</text>
      <text x="48" y="28" fill="#ffffff" font-size="12" font-weight="700">VoteSecure Pod 2 (Replica)</text>
      <text x="48" y="44" fill="#60a5fa" font-size="10">Kubernetes Zero-Downtime</text>
      <text x="48" y="58" fill="#94a3b8" font-size="9">RollingUpdate: maxSurge=1</text>
    </g>

    <!-- EC2 Compute Host / Auto Scaling -->
    <g transform="translate(590, 42)" class="hover-lift">
      <rect width="280" height="66" rx="10" fill="#0f172a" stroke="#FF9900" stroke-width="1.5"/>
      <circle cx="24" cy="33" r="14" fill="#FF9900" opacity="0.2"/>
      <text x="24" y="37" font-size="14" text-anchor="middle">⚡</text>
      <text x="48" y="28" fill="#FFB84D" font-size="12" font-weight="700">AWS EC2 Compute / ASG</text>
      <text x="48" y="44" fill="#e2e8f0" font-size="10">Ubuntu 22.04 LTS (t3.small/medium)</text>
      <text x="48" y="58" fill="#94a3b8" font-size="9">Automated Docker User Data Bootstrap</text>
    </g>
  </g>

  <!-- Animated Stepped Pipe between Tier 3 and Tier 4 -->
  <path d="M 155 505 L 155 530 L 250 530 L 250 545" fill="none" stroke="#34d399" stroke-width="2.5" class="pulse-line"/>
  <path d="M 435 505 L 435 530 L 250 530 L 250 545" fill="none" stroke="#34d399" stroke-width="2.5" class="pulse-line"/>

  <!-- ===================================================================== -->
  <!-- STEP 4: PRIVATE DATA SUBNET & STORAGE (RDS MULTI-AZ & S3)             -->
  <!-- ===================================================================== -->
  <g transform="translate(50, 540)">
    <rect width="900" height="115" rx="14" fill="url(#tier4Grad)" stroke="#059669" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="24" y="24" fill="#34d399" font-size="11" font-weight="800" letter-spacing="1">STEP 4: PRIVATE DATABASE &amp; PERSISTENT STORAGE TIER (10.0.3.0/24 &amp; 10.0.4.0/24)</text>

    <!-- Amazon RDS Multi-AZ Primary -->
    <g transform="translate(30, 38)" class="hover-lift">
      <rect width="250" height="64" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
      <text x="125" y="24" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">🗄️ AWS RDS MySQL 8.0</text>
      <text x="125" y="40" fill="#cbd5e1" font-size="10" text-anchor="middle">Primary DB (Port 3306) | Private Subnet AZ-1</text>
      <text x="125" y="54" fill="#94a3b8" font-size="9" text-anchor="middle">Prepared Statements &amp; Atomic Transactions</text>
    </g>

    <!-- Amazon RDS Multi-AZ Standby -->
    <g transform="translate(310, 38)" class="hover-lift">
      <rect width="250" height="64" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="125" y="24" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">🔄 Multi-AZ Standby Replica</text>
      <text x="125" y="40" fill="#cbd5e1" font-size="10" text-anchor="middle">Synchronous Replication | Private Subnet AZ-2</text>
      <text x="125" y="54" fill="#94a3b8" font-size="9" text-anchor="middle">Automated 60-Second Failover</text>
    </g>

    <!-- Amazon S3 & Secrets Manager -->
    <g transform="translate(590, 38)" class="hover-lift">
      <rect width="280" height="64" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      <text x="140" y="24" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">📦 Amazon S3 &amp; Secrets Manager</text>
      <text x="140" y="40" fill="#cbd5e1" font-size="10" text-anchor="middle">Candidate Images, Uploads &amp; Backups</text>
      <text x="140" y="54" fill="#94a3b8" font-size="9" text-anchor="middle">KMS Encrypted Credentials &amp; TLS 1.3</text>
    </g>

    <!-- DB Sync Replication Line -->
    <line x1="280" y1="70" x2="310" y2="70" stroke="#10b981" stroke-width="2" class="pulse-line"/>
  </g>

</svg>
