services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: votesecure_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: voting_user
      DB_PASS: voting_secret
      DB_NAME: aws_voting
      APP_NAME: "VoteSecure"
      APP_URL: "http://localhost:8080"
    volumes:
      - ./uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - voting_network

  db:
    image: mysql:8.0
    container_name: votesecure_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password_secret
      MYSQL_DATABASE: aws_voting
      MYSQL_USER: voting_user
      MYSQL_PASSWORD: voting_secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/aws_voting.sql:/docker-entrypoint-initdb.d/01_aws_voting.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "voting_user", "-pvoting_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - voting_network

  # Optional phpMyAdmin for web-based DB administration (visit http://localhost:8081)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: votesecure_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - voting_network

volumes:
  db_data:

networks:
  voting_network:
    driver: bridge
