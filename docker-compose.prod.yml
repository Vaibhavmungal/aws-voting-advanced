services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-aws-voting}:${IMAGE_TAG:-latest}
    container_name: votesecure_prod_app
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-voting_user}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-aws_voting}
      APP_NAME: "${APP_NAME:-VoteSecure}"
      APP_URL: "${APP_URL:-http://localhost}"
    volumes:
      - app_uploads:/var/www/html/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - votesecure_net

  # Containerized MySQL database for single-host deployments (e.g. EC2)
  # If using AWS RDS, you can comment this service out and point DB_HOST to RDS endpoint.
  db:
    image: mysql:8.0
    container_name: votesecure_prod_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-aws_voting}
      MYSQL_USER: ${DB_USER:-voting_user}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-voting_user}", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - votesecure_net

volumes:
  app_uploads:
    driver: local
  db_prod_data:
    driver: local

networks:
  votesecure_net:
    driver: bridge
